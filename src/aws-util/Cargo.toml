[package]
name = "mz-aws-util"
description = "AWS utilities."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
aws-config.workspace = true
aws-sdk-s3 = { workspace = true, optional = true }
aws-smithy-async.workspace = true
aws-smithy-http-client.workspace = true
aws-smithy-runtime-api = { workspace = true, features = ["client", "http-1x"] }
aws-smithy-types = { workspace = true, features = ["http-body-1-x"] }
aws-types.workspace = true
bytes.workspace = true
bytesize.workspace = true
futures.workspace = true
http.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
mz-ore = { path = "../ore", features = ["async", "network"], default-features = false }
pin-project.workspace = true
rustls.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true

[dev-dependencies]
mz-ore = { path = "../ore", default-features = false, features = ["test"] }
uuid = { workspace = true, features = ["v4"] }

[features]
default = []
s3 = ["aws-sdk-s3"]
